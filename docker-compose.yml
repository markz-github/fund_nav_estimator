services:
  backend:
    container_name: fund-nav-estimator-${DEPLOY_ENV:-prod}-backend
    build:
      context: ./backend
      args:
        BACKEND_BASE_IMAGE: ${BACKEND_BASE_IMAGE:-192.168.50.50:16060/markz/fund-nav-estimator-backend-base:py3.14-deps-20260524-193621}
    image: fund-nav-estimator-backend:${DEPLOY_ENV:-prod}
    restart: unless-stopped
    network_mode: bridge
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: ${DEPLOY_ENV:-local}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - /share/Container/fund-nav-estimator/test/backend/logs:/data/test/logs

  frontend:
    container_name: fund-nav-estimator-${DEPLOY_ENV:-prod}-frontend
    build:
      context: ./frontend
      target: build
      args:
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/fund-nav-estimator/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: fund-nav-estimator-frontend:${DEPLOY_ENV:-prod}
    command: sh -c "rm -rf /dist/* && cp -a /app/dist/. /dist/"
    volumes:
      - /share/Container/fund-nav-estimator/test/frontend/dist:/dist
    profiles:
      - build
